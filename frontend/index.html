<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0D0B" />

    <!-- Primary -->
    <title>gitchat — Talk to any codebase like it's a teammate.</title>
    <meta name="title" content="gitchat — Talk to any codebase like it's a teammate." />
    <meta
      name="description"
      content="Drop a GitHub repo, ask a question in plain English, and get answers grounded in real code. Every answer cites the exact file and line — no hallucinated code. Trace flows, review PRs, and understand architecture."
    />
    <meta
      name="keywords"
      content="AI code review, chat with codebase, RAG code analysis, codebase Q&A, pull request review AI, code architecture diagram, AI code assistant, GitHub code search"
    />
    <meta name="author" content="gitchat" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="gitchat — Talk to any codebase like it's a teammate." />
    <meta
      property="og:description"
      content="Drop a GitHub repo, ask a question, get answers grounded in real code with file-and-line citations. Trace flows, review PRs, understand architecture."
    />
    <meta property="og:site_name" content="gitchat" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="gitchat — Talk to any codebase like it's a teammate." />
    <meta
      name="twitter:description"
      content="Ask any codebase a question and get answers grounded in real code. Every answer cites the exact file and line."
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Preconnect to the font host -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "gitchat",
        "description": "Ask questions about any codebase and get answers grounded in real code with file-and-line citations. Supports GitHub repos and local file uploads.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Chat with a codebase",
          "GitHub repository indexing",
          "Local file upload",
          "Pull request and diff analysis",
          "Architecture dependency diagrams",
          "File and line level citations",
          "Shareable read-only sessions"
        ],
        "author": { "@type": "Organization", "name": "gitchat" }
      }
    </script>
  </head>

  <body>
    <div id="root">
      <noscript>
        <h1>gitchat — Talk to any codebase like it's a teammate.</h1>
        <p>
          gitchat lets you ask questions about an entire codebase. Connect a GitHub
          repository or upload source files, then ask how a flow works, what a pull
          request changes, or where a value gets validated. Every answer links back
          to the file and line it came from.
        </p>
        <p>JavaScript is required to use the application.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
